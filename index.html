<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitale Visitenkarte | Dozent VHS</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #005A9C; /* Klassisches VHS-Blau, gerne anpassen */
            --accent-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px 20px;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--accent-color);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: var(--primary-color); }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 25px; font-weight: 500; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            background: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background: #004475;
            border-color: #004475;
        }
        footer { margin-top: 30px; font-size: 11px; color: #999; }
        footer a { color: #999; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <!-- Profilbild (Emoji als Platzhalter, kann durch <img src="foto.jpg"> ersetzt werden) -->
    <div class="profile-img">👨‍🏫</div>
    
    <h1>Sven Weidmann</h1>
    <div class="subtitle">Dozent für bei der VHS</div>

    <div class="links">
        <!-- Wichtigster Button: Kontakt direkt speichern -->
        <a href="kontakt.vcf" class="btn btn-primary">📇 Kontakt speichern</a>
        
        <!-- Weitere Links zu Ihren Kursen -->
        <a href="https://vhs-hunsrueck.de/Kontakt/cmx68ca7cd7316cb.html" target="_blank" rel="noopener" class="btn">🏫 Meine aktuellen Kurse</a>
        <a href="mailto:sven.weidmann@vhs.cloud" class="btn">✉️ E-Mail schreiben</a>
        <a href="{Link zu LinkedIn / Homepage}" target="_blank" rel="noopener" class="btn">🌐 Berufliches Profil</a>
    </div>

    <footer>
        <a href="#impressum">Impressum & Datenschutz</a>
    </footer>
</div>

</body>
</html>
